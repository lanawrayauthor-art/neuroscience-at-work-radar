# =====================================================================
# Neuroscience at Work — Radar configuration
# Edit this file to tune what the weekly scan looks for.
# =====================================================================

# Used only for polite identification to the free APIs (OpenAlex/Crossref).
# You can leave the example or put your real email — it is NOT a secret/login.
contact_email: "you@example.com"

# How far back each weekly run looks (in days). 8 = one week + small overlap.
since_days: 8

# Safety limits so a run never returns thousands of rows.
max_per_query: 15
max_new_total: 120

# A candidate is kept only if its title/venue contains at least ONE of these
# words. This filters out off-topic hits from the broad search queries.
# --- topic filter (three levels) -------------------------------------------
# context : the paper must sit in a world-of-work setting. Required.
# subject : optional second gate. Leave empty for wider recall; fill it in to
#           tighten the feed to brain/stress/wellbeing themes only.
# exclude : hard reject regardless of the above. This is what keeps agronomy,
#           materials science and clinical-patient studies out of the feed.

must_match_context:
  - work
  - job
  - employe          # employee / employees / employer / employment
  - workplace
  - occupational
  - worker
  - staff
  - manager
  - managerial
  - leadership
  - remote
  - hybrid
  - telework
  - teleworker
  - organization
  - organisation
  - organizational
  - organisational
  - team
  - career
  - labour
  - labor
  - professional

must_match_subject: []
  # Suggested contents if you ever want to tighten the feed — paste in place of []:
  #  - burnout
  #  - stress
  #  - exhaustion
  #  - wellbeing
  #  - well-being
  #  - mental health
  #  - cognitive
  #  - attention
  #  - focus
  #  - engagement
  #  - technostress
  #  - fatigue
  #  - sleep
  #  - brain
  #  - neuro
  #  - psychological
  #  - motivation
  #  - productivity

exclude_any:
  # agronomy / plant science
  - crop
  - drought
  - soil
  - agronom
  - "plant "
  - germinab
  # materials / chemistry
  - alloy
  - microstructur
  - thermal
  - biodegrad
  - chemistr
  - molecul
  - catalys
  - nanoparticle
  # lab / animal models
  - in vitro
  - murine
  - " rats"
  - " mice"
  # clinical patient outcomes (not occupational health)
  - oncolog
  - cancer
  - tumor
  - tumour
  - chemotherap
  - stoma
  - palliativ
  - carcinom
  - alzheimer
  - dementia
  - parkinson
  - stroke patient
  - maternal
  - fetal
  - neonat
  - pregnan
  - biomedicine
  - microbiom
  - gene expression

# The search phrases sent to every enabled source. Add/remove freely.
queries:
  - "workplace burnout neuroscience"
  - "occupational stress cortisol HPA axis"
  - "remote work wellbeing productivity"
  - "hybrid work employee outcomes"
  - "attention interruptions knowledge workers"
  - "psychological safety teams"
  - "work engagement job demands resources"
  - "human-AI collaboration workplace"
  - "generative AI worker productivity"
  - "technostress employees"
  - "loneliness work social connection"
  - "sleep deprivation cognitive performance work"
  - "job strain cardiovascular disease"
  - "manager training mental health at work"

# Which free data sources to query (all keyless).
sources:
  openalex: true
  crossref: true
  europepmc: true
  arxiv: true

# --- Auto-scoring settings (optional; sensible defaults are built into the script) ---

# How many top candidates to show in the weekly digest.md
digest_top_n: 12

# Journals/publishers that add trust points. Add your own (lowercase substrings).
trusted_venues:
  - lancet
  - nature
  - science
  - nejm
  - jama
  - bmj
  - plos
  - pnas
  - psychological science
  - journal of applied psychology
  - journal of occupational health psychology
  - occupational and environmental medicine
  - sleep
  - current biology
  - neuron
  - nature reviews
  - nature human behaviour
  - management science
  - quarterly journal of economics
  - organization science
  - frontiers
  - journal of managerial psychology
  - journal of happiness studies
  - psychological bulletin
  - american psychologist
  - work & stress
  - psychoneuroendocrinology
  - world psychiatry

# Intergovernmental / official sources that add trust points.
intergov_venues:
  - who
  - world health
  - oecd
  - " ilo"
  - eurofound
  - surgeon general
  - cdc
  - niosh
  - eu-osha

# Phrases that flag a possible neuromyth (marked MYTH-CHECK, not auto-rejected).
myth_triggers:
  - dopamine detox
  - dopamine fasting
  - 8-second attention
  - goldfish attention
  - 10% of the brain
  - ten percent of the brain
  - reptilian brain
  - amygdala hijack
  - left-brain
  - right-brain
  - learning styles
  - 10,000 hour
  - neuro-linguistic programming
  - digital dementia
  - virtual dementia
