name: Weekly source radar

# Runs automatically every Monday at 07:00 UTC, and can also be started by hand
# from the Actions tab (the "Run workflow" button).
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

# Lets the built-in GitHub token commit the new candidates back to the repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the radar
        run: python scan_sources.py

      - name: Commit any new candidates
        run: |
          git config user.name "source-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/
          if git diff --staged --quiet; then
            echo "No new candidates this week."
          else
            git commit -m "Weekly radar: new candidate sources ($(date -u +%F))"
            git push
          fi
